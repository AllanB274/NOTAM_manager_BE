<!DOCTYPE html>
<html lang="en">
<head>
    {% set titre="Sign up" %}
    {% include("layout/head.html") %}
</head>
<body>
{% include("layout/navbar.html") %}

<div class="hero">
    {% include("layout/bgimg.html") %}

    <div class="container">
        <div class="row justify-content-center align-items-center">
            <div class="col-12 text-center">
                <h1 class="heading" data-aos="fade-up">
                    Sign up
                </h1>
                <form
                        action="/signup"
                        class="w-100 mb-3"
                        data-aos="fade-up"
                        data-aos-delay="200"
                        method="post"
                >




                    <div class="container-fluid">
                        <div class="row justify-content-center align-items-center">
                            <div class="col-3 mx-2">
                                <div class="row mb-2">

                                    <input
                                            id = "lastname"
                                            name = "lastname"
                                            type="text"
                                            style="border-radius: 50px;"
                                            class="form-control px-3"
                                            placeholder="Last name"
                                    />

                                </div>

                                <div class="row mb-2">
                                        
                                    <input
                                            id = "firstname"
                                            name = "firstname"
                                            type="text"
                                            style="border-radius: 50px;"
                                            class="form-control px-3"
                                            placeholder="First name"
                                    />

                                </div>

                                <div class="row mb-2">

                                    <input
                                            id = "username"
                                            name = "username"
                                            type="text"
                                            style="border-radius: 50px;"
                                            class="form-control px-3"
                                            placeholder="username"
                                    />

                                </div>

                                <div class="row mb-2">

                                    <input
                                            id ="mdp"
                                            name = "mdp"
                                            type="password"
                                            style="border-radius: 50px;"
                                            class="form-control px-3"
                                            placeholder="Password"
                                    />

                                </div>
                            </div>

                            <div class="col-3 mb-3">
                                <label class="text-white mb-2">Choose your avatar :</label>
                                <div class="row g-2">
                                    {% for i in range(1, 13) %}
                                    <div class="col-4 text-center">
                                        <input type="radio" name="avatar" id="avatar{{i}}" value="{{i}}.png" class="btn-check" {% if i == 1 %}checked{% endif %}>
                                        <label class="btn btn-outline-light p-1 rounded-circle" for="avatar{{i}}">
                                            <img src="/static/img/avatar/{{i}}.png" class="img-fluid rounded-circle" style="width: 50px; height: 50px; object-fit: cover;"/>
                                        </label>
                                    </div>
                                    {% endfor %}
                                </div>
                            </div>
      

                            <div class="col-2 align-self-center mx-2">

                                <div class="row mb-2">
                            
                                    <div class="form-check">
                                        <input class="form-check-input" type="radio" name="role" id="admin", value="admin">
                                        <label class="form-check-label text-white" for="radioDefault1">
                                            Admin
                                        </label>
                                    </div>
                                    <div class="form-check">
                                        <input class="form-check-input" type="radio" name="role" id="client", value="client" checked>
                                        <label class="form-check-label text-white" for="radioDefault2">
                                            Client
                                        </label>
                                    </div>
                                </div>

                                <div class="row mb-2">

                                    <input
                                            id = "mdpAdmin"
                                            name = "mdpAdmin"
                                            type="password"
                                            class="form-control px-3"
                                            placeholder="Admin key if admin"
                                    />

                                </div>



                            </div>
                            <div class="row-4 justify-content-center align-items-end pt-5 ">
                                <button type="submit" class="btn btn-primary">Sign-up</button>
                            </div>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% include("layout/footer.html") %}
</body>
</html>
