<!DOCTYPE html>
<html lang="en">
<head>
    {% set titre="Sign up" %}
    {% include("layout/head.html") %}
</head>
<body>
{% include("layout/navbar.html") %}

<div class="hero">
    {% include("layout/bgimg.html") %}

    <div class="container">
        <div class="row justify-content-center align-items-center">
            <div class="col-lg-9 text-center">
                <h1 class="heading" data-aos="fade-up">
                    Sign up
                </h1>
                <form
                        action="\signup"
                        class="narrow-w form-search d-flex align-items-stretch mb-3"
                        data-aos="fade-up"
                        data-aos-delay="200"
                        method="post"
                >
                    <input
                            id = "lastname"
                            name = "lastname"
                            type="text"
                            class="form-control px-3"
                            placeholder="Last name"
                    />
                    <input
                            id = "firstname"
                            name = "firstname"
                            type="text"
                            class="form-control px-3"
                            placeholder="First name"
                    />
                    <br>
                    <input
                            id = "username"
                            name = "username"
                            type="text"
                            class="form-control px-3"
                            placeholder="username"
                    />
                    <input
                            id ="mdp"
                            name = "mdp"
                            type="text"
                            class="form-control px-3"
                            placeholder="Password"
                    />
                    
                    <h5>Choisissez un avatar</h5>
                    {% for i in range(1,13) %}
                     <input type="radio" name="avatar" value="{{i}}.png">
                     <img src="/static/img/avatar/{{i}}.png" class="user-avatar"/>
                    {% endfor %}
                    
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="role" id="admin", value="admin">
                          <label class="form-check-label text-white" for="radioDefault1">
                            Admin
                          </label>
                      </div>
                      <div class="form-check">
                        <input class="form-check-input" type="radio" name="role" id="client", value="client" checked>
                          <label class="form-check-label text-white" for="radioDefault2">
                            Client
                          </label>
                      </div>
                    <input
                            id = "mdpAdmin"
                            name = "mdpAdmin"
                            type="text"
                            class="form-control px-3"
                            placeholder="Admin key if admin"
                    />
                    <button type="submit" class="btn btn-primary">Sign-up</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% include("layout/footer.html") %}
</body>
</html>
