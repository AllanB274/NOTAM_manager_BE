<!DOCTYPE html>
<html lang="en">

<head>
    {% set titre="Add Notam" %}
    {% include("layout/head.html") %}
</head>

<body>
    {% include("layout/navbar.html") %}

    <div class="hero">
        {% include("layout/bgimg.html") %}

        <div class="container" style="padding: 11em; height: 100%;">
            <div class="row justify-content-center align-items-center">
                <div class="col-lg-9 text-center">
                    <h1 class="heading" data-aos="fade-up">
                        Add Notam
                    </h1>

                    <form action="/ajouterNotam" class="narrow-w form-search d-flex align-items-stretch mb-3"
                        data-aos="fade-up" data-aos-delay="200" method="post">

                        <div class="container">
                            <div class="col-12 mx-auto">

                                <!-- ID NOTAM -->
                                <div class="row mb-2 align-items-center">
                                    <div class="col-3 text-white">
                                        ID Notam
                                    </div>
                                    <div class="col">
                                        <input type="text" id="idNotam" name="idNotam" class="form-control px-3"
                                            placeholder="NOTAM ID" />
                                    </div>
                                </div>

                                <!-- TYPE NOTAM -->
                                <div class="row mb-2 align-items-center">
                                    <div class="col-3 text-white">
                                        Type Notam
                                    </div>
                                    <div class="col">
                                        <select id="typeNotam" name="typeNotam" class="form-select px-3">
                                            <option value="NOTAMN">NOTAM [N]</option>
                                            <option value="NOTAMR">NOTAM [R]</option>
                                            <option value="NOTAMC">NOTAM [C]</option>
                                        </select>
                                    </div>
                                </div>

                                <!-- START AND END DATE -->
                                <div class="row mb-2 align-items-center">
                                    <!-- <div class="col-3 text-white">
                                    Start Date
                                </div> -->
                                    <div class="text-white">
                                        Dates
                                    </div>
                                    <div class="col-6">
                                        <input type="datetime-local" id="dateStartNotam" name="dateStartNotam"
                                            class="form-control px-3" />
                                    </div>
                                    <div class="col-6">
                                        <input type="datetime-local" id="dateEndNotam" name="dateEndNotam"
                                            class="form-control px-3" />
                                    </div>
                                </div>

                                <!-- Créneau -->
                                <div class="row mb-3 justify-content-center align-items-center">
                                    <!-- <div class="col-3 text-white">
                                    Start Date
                                </div> -->
                                    <div class="text-white">
                                        Time Window
                                    </div>
                                    <div class="col-3">
                                        <input type="number" min="0" max="23" step="1" id="startCreneau"
                                            name="startCreneau" class="form-control px-3" placeholder="0 - 23 H" />
                                    </div>
                                    <div class="col-auto text-white">
                                        -
                                    </div>
                                    <div class="col-3">
                                        <input type="number" min="0" max="23" step="1" id="endCreneau" name="endCreneau"
                                            class="form-control px-3" placeholder="0 - 23 H" />
                                    </div>
                                </div>

                                <!-- DESCRIPTION -->
                                <div class="row mb-2 align-items-center">
                                    <div class="col-3 text-white">
                                        Description
                                    </div>
                                    <div class="col">
                                        <input type="text" id="descNotam" name="descNotam" class="form-control px-3"
                                            placeholder="Description" />
                                    </div>
                                </div>

                                <!-- RANGE FL -->
                                <div class="row mb-2 justify-content-center align-items-center">
                                    <div class="text-white">
                                        Range FL
                                    </div>
                                    <div class="col">
                                        <input type="number" min="0" max="600" step="5" id="lowerFLNotam"
                                            name="lowerFLNotam" class="form-control px-3" placeholder="0 - 600" />
                                    </div>
                                    <div class="col-auto text-white">
                                        -
                                    </div>
                                    <div class="col">
                                        <input type="number" min="0" max="600" step="5" id="upperFLNotam"
                                            name="upperFLNotam" class="form-control px-3" placeholder="0 - 600" />
                                    </div>
                                </div>

                                <!-- Type de vol -->
                                <div class="row mb-2 align-items-center">
                                    <div class="col-3 text-white">
                                        Flight Type
                                    </div>
                                    <div class="col">

                                        <div class="dropdown">
                                            <button class="form-select text-start" data-bs-toggle="dropdown">
                                                Select Flight types
                                            </button>

                                            <div class="dropdown-menu p-2">
                                                <div class="form-check">
                                                    <input class="form-check-input" name="flightType" type="checkbox" value="V">
                                                    <label class="form-check-label">VFR</label>
                                                </div>

                                                <div class="form-check">
                                                    <input class="form-check-input" name="flightType" type="checkbox" value="I">
                                                    <label class="form-check-label">IFR</label>
                                                </div>
                                            </div>
                                        </div>

                                    </div>
                                </div>

                                <!-- AERODROME -->
                                <div class="row mb-2 align-items-center">
                                    <div class="col-3 text-white">
                                        Airport
                                    </div>
                                    <div class="col">
                                        <select type="text" id="airport" name="airport" class="form-select px-3"
                                            placeholder="Departure">
                                            {% for ap in airports %}
                                            <option value="{{ap['idAerodrome']}}" id="departure">{{ap['nomAerodrome']}}
                                            </option>
                                            {% endfor %}
                                        </select>
                                    </div>
                                </div>

                                <!-- OBJETS -->
                                <div class="row mb-2 align-items-center">
                                    <div class="col-3 text-white">
                                        Object concerned
                                    </div>
                                    <div class="col">
                                        <select type="text" id="object" name="object" class="form-select px-3"
                                            placeholder="Departure">
                                            {% for ob in objects %}
                                            <option value="{{ob['idObjet']}}" id="departure">{{ob['nomObjet']}}
                                            </option>
                                            {% endfor %}
                                        </select>
                                    </div>
                                </div>

                                <!-- BUTTON -->
                                <div class="col mx-auto mt-3">
                                    <button type="submit" class="btn btn-primary">
                                        Add
                                    </button>
                                </div>

                            </div>
                        </div>

                    </form>
                </div>
            </div>
        </div>
    </div>

    {% include("layout/footer.html") %}
</body>

</html>
