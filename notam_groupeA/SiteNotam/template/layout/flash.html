{% with messages = get_flashed_messages(with_categories=true) %}
  {% if messages %}
    <div id="flash-container">
      {% for category, message in messages %}
        <div class="flash-message {{ category }}">
          {{ message }}
        </div>
      {% endfor %}
    </div>
  {% endif %}
{% endwith %}
<script>
  setTimeout(() => {
    const container = document.getElementById("flash-container");
    if (container) {
        container.remove();
    }
}, 5000);
</script>
{% block body %}
{% endblock %}
