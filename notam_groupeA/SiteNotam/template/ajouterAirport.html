<!DOCTYPE html>
<html lang="en">
<head>
    {% set titre="Sign in" %}
    {% include("layout/head.html") %}
</head>
<body>
{% include("layout/navbar.html") %}

<div class="hero">
    {% include("layout/bgimg.html") %}

    <div class="container">
        <div class="row justify-content-center align-items-center">
            <div class="col-lg-9 text-center">
                <h1 class="heading" data-aos="fade-up">
                    Add Airport
                </h1>
                <form
                        action="\ajouterAirport"
                        class="narrow-w form-search d-flex align-items-stretch mb-3"
                        data-aos="fade-up"
                        data-aos-delay="200"
                        method="post"
                >
                    <input
                            id = "codeAerodrome"
                            name = "codeAerodrome"
                            type="text"
                            class="form-control px-3"
                            placeholder="code"
                    />
                    <input
                            id = "nomAerodrome"
                            name = "nomAerodrome"
                            type="text"
                            class="form-control px-3"
                            placeholder="name"
                    />
                    <br>
                    <input
                            id = "region"
                            name = "region"
                            type="text"
                            class="form-control px-3"
                            placeholder="region"
                    />
                    <input
                            id ="departement"
                            name = "departement"
                            type="text"
                            class="form-control px-3"
                            placeholder="departement"
                    />

                    <input
                            id ="ville"
                            name = "ville"
                            type="text"
                            class="form-control px-3"
                            placeholder="city"
                    />

                    <input
                            id ="pays"
                            name = "pays"
                            type="text"
                            class="form-control px-3"
                            placeholder="country"
                    />
                    <button type="submit" class="btn btn-primary">Add</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% include("layout/footer.html") %}
</body>
</html>
