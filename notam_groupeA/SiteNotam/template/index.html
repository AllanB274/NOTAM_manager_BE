<!DOCTYPE html>
<html lang="en">
  <head>
    {% set titre="Home Page" %}
    {% include("layout/head.html") %}
  </head>
  <body>
    {% include("layout/navbar.html") %}

    <div class="hero">
      {% include("layout/bgimg.html") %}

      <div class="container">
        <div class="row justify-content-center align-items-center">
          <div class="col-lg-9 text-center">
            <h1 class="heading" data-aos="fade-up">
              Easiest way to reach home safely
            </h1>
            <form
              action="/versvol"
              class="narrow-w form-search d-flex align-items-stretch mb-3"
              data-aos="fade-up"
              data-aos-delay="200"
            >
              <select
                name="departure"
                id="departure"
                class="form-select px-4 mx-2"
                placeholder="Departure"
              >
                {% for ap in airports %}
                <option value="{{ap['idaerodrome']}}">{{ap['nomAerodrome']}}</option>
                {% endfor %}
              </select>
              <select
                name="arrival"
                id="arrival"
                class="form-select px-4 mx-2"
                placeholder="Arrival"
              >
                {% for ap in airports %}
                <option value="{{ap['idaerodrome']}}">{{ap['nomAerodrome']}}</option>
                {% endfor %}
              </select>
              <button type="submit" class="btn btn-primary">Check</button>
            </form>
          </div>
        </div>
      </div>
    </div>


    {% include("layout/footer.html") %}
  </body>
</html>
