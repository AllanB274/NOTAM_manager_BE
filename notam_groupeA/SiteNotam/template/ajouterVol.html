<!DOCTYPE html>
<html lang="en">
<head>
    {% set titre="Add Vol" %}
    {% include("layout/head.html") %}
</head>
<body>
{% include("layout/navbar.html") %}

<div class="hero">
    {% include("layout/bgimg.html") %}

    <div class="container" style="padding: 9em; height: 100%;">
        <div class="row justify-content-center align-items-center">
            <div class="col-lg-9 text-center">
                <h1 class="heading" data-aos="fade-up">
                    Add Flight
                </h1>

                <form
                    action="/ajoutvol"
                    class="narrow-w form-search d-flex align-items-stretch mb-3"
                    data-aos="fade-up"
                    data-aos-delay="200"
                    method="post"
                >

                    <div class="container">
                        <div class="col-12 mx-auto">


                            <!-- TYPE VOL -->
                            <div class="row mb-2 align-items-center">
                                <div class="col-3 text-white">
                                    Flight Tyoe
                                </div>
                                <div class="col">
                                    <select
                                        id="typeVol"
                                        name="typeVol"
                                        class="form-select px-3"
                                    >
                                        <option value="I">IFR</option>
                                        <option value="V">VFR</option>
                                    </select>
                                </div>
                            </div>

                            <!-- START AND END DATE -->
                            <div class="row mb-2 align-items-center">
                                <!-- <div class="col-3 text-white">
                                    Start Date and end Date
                                </div> -->
                                <div class="text-white">
                                    Dates
                                </div>
                                <div class="col-6">
                                    <input
                                        type="datetime-local"
                                        id="dateStartVol"
                                        name="dateStartVol"
                                        class="form-control px-3"
                                    />
                                </div>
                                <div class="col-6">
                                    <input
                                        type="datetime-local"
                                        id="dateEndVol"
                                        name="dateEndVol"
                                        class="form-control px-3"
                                    />
                                </div>
                            </div>


                            <div class="row mb-2 align-items-center">
                                <div class="col-3 text-white">
                                    Flight's name
                                </div>
                                <div class="col">
                                    <input
                                        type="text"
                                        id="nameVol"
                                        name="nameVol"
                                        class="form-control px-3"
                                        placeholder="Name"
                                    />
                                </div>
                            </div> 

                            

                            

                           

                            <!-- AERODROME -->
                            <div class="row mb-2 align-items-center">
                                <div class="col-12 text-white mb-2">
                                    Airports
                                </div>
                                <div class="col-6">
                                    <select
                                        type="text"
                                        id="airportdepart"
                                        name="airportdepart"
                                        class="form-select px-3"
                                        placeholder="Departure"
                                    >
                                        {% for ap in airports %}
                                        <option value="{{ap['idAerodrome']}}" id="departure">{{ap['nomAerodrome']}}</option>
                                        {% endfor %}
                                    </select>
                                </div>


                                <div class="col-6">
                                    <select
                                        type="text"
                                        id="airportarrival"
                                        name="airportarrival"
                                        class="form-select px-3"
                                        placeholder="Arrival"
                                    >
                                        {% for ap in airports %}
                                        <option value="{{ap['idAerodrome']}}" id="arrival">{{ap['nomAerodrome']}}</option>
                                        {% endfor %}
                                    </select>
                                </div>
                            </div>


                             <div class="row mb-2 align-items-center">
                                <div class="col-3 text-white">
                                    Alternate airport
                                </div>
                                <div class="col">
                                    <select
                                        name="degagements[]"
                                        id="degagements"
                                        class="form-select"
                                        multiple
                                        size="6"
                                    >
                                        {% for ap in airports %}
                                        <option value="{{ ap['idAerodrome'] }}">
                                            {{ ap['codeAerodrome'] }} - {{ ap['nomAerodrome'] }}
                                        </option>
                                        {% endfor %}
                                    </select>
                                </div>
                            </div>

                            

                            <!-- BUTTON -->
                            <div class="col mx-auto mt-3">
                                <button type="submit" class="btn btn-primary">
                                    Add
                                </button>
                            </div>

                        </div>
                    </div>

                </form>
            </div>
        </div>
    </div>
</div>

{% include("layout/footer.html") %}
</body>
</html>
